# shamelessly copied from https://github.com/cranci1/Luna/blob/main/.github/workflows/build.yml

name: Build and upload nightly

on:
 push:
   branches:
     - main

env:
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
 # The release every build lands in. It was "beta", a pre-release named "First".
 RELEASE_TAG: latest

jobs:
 prepare-release:
   name: Prepare release
   runs-on: ubuntu-latest
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@v6

     # The tag follows main, so the release's source is the commit its builds came from.
     - name: Move the release tag to this commit
       run: |
         git tag -f "$RELEASE_TAG"
         git push -f origin "refs/tags/$RELEASE_TAG"

     # Made once here, before the builds, which upload to it side by side.
     - name: Create the release if it's missing
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
           gh release create "$RELEASE_TAG" --verify-tag --title "Shirox" --notes "Building…" --latest

 build-ios:
   name: Build iOS IPA
   needs: prepare-release
   runs-on: macos-26
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@v6

     - name: Make build script executable
       run: chmod +x ./buildipa.sh

     - name: Build iOS IPA
       run: ./buildipa.sh

     - name: Upload IPA
       uses: actions/upload-artifact@v7
       with:
         name: Shirox-Nightly-IPA
         path: build/Shirox.ipa

     - name: Upload IPA to the release
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: gh release upload "$RELEASE_TAG" build/Shirox.ipa --clobber

     - name: Update apps.json
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         IPA_SIZE=$(wc -c < build/Shirox.ipa | tr -d ' ')
         BUILD_DATE=$(date -u +%Y-%m-%d)
         jq --argjson size "$IPA_SIZE" --arg date "$BUILD_DATE" \
           '.apps[0].versions[0].size = $size | .apps[0].versions[0].date = $date' \
           apps.json > apps.json.tmp && mv apps.json.tmp apps.json
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         git add apps.json
         git diff --cached --quiet || (git commit -m "chore: update apps.json [skip ci]" && git push origin HEAD:main)

 build-catalyst:
   name: Build Mac Catalyst DMG
   needs: prepare-release
   runs-on: macos-26
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@v6

     - name: Make build script executable
       run: chmod +x ./buildcatalyst.sh

     - name: Build Mac Catalyst DMG
       run: ./buildcatalyst.sh

     - name: Upload Catalyst DMG
       uses: actions/upload-artifact@v7
       with:
         name: Shirox-Nightly-Catalyst-DMG
         path: build/Shirox-Catalyst.dmg

     - name: Upload Catalyst DMG to the release
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: gh release upload "$RELEASE_TAG" build/Shirox-Catalyst.dmg --clobber

 build-macos:
   name: Build native macOS DMG
   needs: prepare-release
   runs-on: macos-26
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@v6

     - name: Make build script executable
       run: chmod +x ./builddmg.sh

     - name: Build native macOS DMG
       run: ./builddmg.sh

     - name: Upload macOS DMG
       uses: actions/upload-artifact@v7
       with:
         name: Shirox-Nightly-macOS-DMG
         path: build/Shirox-macOS.dmg

     - name: Upload macOS DMG to the release
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: gh release upload "$RELEASE_TAG" build/Shirox-macOS.dmg --clobber

 publish-release:
   name: Publish release
   needs: [build-ios, build-catalyst, build-macos]
   runs-on: ubuntu-latest
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@v6

     # Named and described from apps.json's newest version, a full release rather than a
     # pre-release, and the one GitHub shows as Latest.
     - name: Name and publish the release
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         VERSION=$(jq -r '.apps[0].versions[0].version' apps.json)
         BUILD=$(jq -r '.apps[0].versions[0].buildVersion' apps.json)
         jq -r '.apps[0].versions[0].localizedDescription' apps.json > notes.md
         printf '\n\n**Downloads:** Shirox.ipa (iPhone, iPad), Shirox-macOS.dmg (Mac), Shirox-Catalyst.dmg (Mac, Catalyst build).\n' >> notes.md
         gh release edit "$RELEASE_TAG" \
           --title "Shirox $VERSION ($BUILD)" \
           --notes-file notes.md \
           --prerelease=false \
           --draft=false \
           --latest
